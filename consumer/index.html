<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12B48F">
  <title>UNIORDER</title>
  <link rel="stylesheet" href="/shared/fonts/fonts.css">
  <link rel="stylesheet" href="/shared/theme.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="lib/leaflet/leaflet.css">
  <script src="lib/qrcode.js" defer></script>
  <script src="lib/leaflet/leaflet.js" defer></script>
  <script src="/shared/fx/counter.js" defer></script>
  <script src="fx.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="phone">
    <!-- 로그인 (시안 76:314) -->
    <section id="loginView" class="login hidden">
      <div class="brand"><img src="img/logo-mark.png" alt=""><b>UNIORDER</b></div>
      <div class="login-hero">
        <p>빠르고 간편하게</p>
        <h1>사장님과 손님의<br><em>통합 테이블오더</em></h1>
      </div>
      <form id="loginForm" class="login-form">
        <div class="login-fields hidden" id="loginFields">
          <input id="loginEmail" type="email" placeholder="이메일" value="user@demo.com" required>
          <input id="loginPw" type="password" placeholder="비밀번호" value="1234" required>
          <input id="signupName" placeholder="이름" class="hidden">
        </div>
        <button type="button" class="link-sm" id="toggleSignup">계정이 없으신가요?</button>
        <button class="mint-btn" id="loginBtn">로그인하기</button>
      </form>
    </section>

    <!-- 메인 -->
    <section id="appView" class="hidden">
      <header class="appbar">
        <div class="brand sm"><img src="img/logo-mark.png" alt=""><b>UNIORDER</b></div>
        <span id="hello"></span>
      </header>
      <main id="screen" class="screen"></main>
      <nav class="bottom-nav" id="nav">
        <button data-view="home" aria-label="홈"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h5v-5.5h3V20h5V9.5"/></svg><span>홈</span></button>
        <button data-view="map" aria-label="지도"><svg viewBox="0 0 24 24"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z"/><path d="M9 4v13.5M15 6.5V20"/></svg><span>지도</span></button>
        <button data-view="wallet" aria-label="지갑"><svg viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="14" rx="2.5"/><path d="M3 9.5h13.5"/><rect x="14" y="12" width="7" height="4.5" rx="1.5"/></svg><span>지갑</span></button>
        <button data-view="me" aria-label="내 정보"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg><span>내 정보</span></button>
      </nav>
    </section>

    <div class="sheet-wrap hidden" id="sheet"><div class="sheet" id="sheetBody"></div></div>
    <div class="toast" id="toast"></div>
  </div>
</body>
</html>
